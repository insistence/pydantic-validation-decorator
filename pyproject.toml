[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-validation-decorator"
version = "0.2.0"
description = "Some practical pydantic validation decorators that support manual invocation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "insistence", email = "3055204202@qq.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Pydantic",
]
dependencies = [
    "pydantic[email]>=2.7.1",
]

[project.urls]
Homepage = "https://github.com/insistence/pydantic-validation-decorator"
Documentation = "https://github.com/insistence/pydantic-validation-decorator"
Repository = "https://github.com/insistence/pydantic-validation-decorator"
Issues = "https://github.com/insistence/pydantic-validation-decorator/issues"

[project.optional-dependencies]
dev = ["build", "pytest", "pytest-asyncio", "ruff", "twine", "ty"]

[tool.setuptools]
packages = ["pydantic_validation_decorator"]

[tool.ruff]
line-length = 120
show-fixes = true
unsafe-fixes = true

[tool.ruff.lint]
select = [
    "FAST",   # fastapi
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "D2",     # docstring layout
    "D3",     # docstring quotation marks
    "D4",     # docstring content
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "FLY",    # flynt
    "I",      # isort
    "N",      # pep8-naming
    "PERF",   # perflint
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]
ignore = [
    "ANN002", # missing type annotation for *{name}
    "ANN003", # missing type annotation for **{name}
    "ANN401", # dynamically typed expressions (typing.Any) are disallowed in {name}
    "B008",   # do not perform function calls in argument defaults
    "COM812", # trailing comma missing
    "RET504", # unnecessary assignment to {name} before return statement
    "SIM105", # use contextlib.suppress({exception}) instead of try-except-pass
    "C901",   # too complex
    "N818",   # exception name {name} should be named with an Error suffix
    "E501",   # line too long
    "W191",   # indentation contains tabs
    "RUF001", # string contains ambiguous
    "RUF002", # docstring contains ambiguous
    "RUF003", # comment contains ambiguous
    "RUF012", # mutable class attributes should be annotated with typing.ClassVar
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-returns = 10

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.ty.environment]
python-platform = "all"

[tool.ty.rules]
blanket-ignore-comment = "error"
disjoint-cast = "error"
dynamic-function-decorator-return = "error"
mismatched-enum-name = "error"
mismatched-namedtuple-name = "error"
mismatched-sentinel-name = "error"
missing-type-argument = "error"
unsound-return = "error"
unsound-yield = "error"

[tool.ty.terminal]
error-on-warning = true
